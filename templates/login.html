<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực Sinh trắc học - Cinema Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #050505;
            color: #fff;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-blur: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">
    <!-- Animated background -->
    <div class="fixed inset-0 z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] animate-pulse"></div>
        <div
            class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] animate-pulse delay-700">
        </div>
    </div>

    <div class="glass w-full max-w-sm rounded-[40px] p-8 relative z-10 text-center shadow-2xl">
        <div class="mb-8">
            <div
                class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-blue-600/40 mb-4 rotate-3 hover:rotate-0 transition-transform duration-500">
                <i class="fa-solid fa-fingerprint text-white text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Truy cập Bảo mật</h1>
            <p class="text-slate-400 text-sm">Vui lòng sử dụng Face ID hoặc Vân tay để tiếp tục</p>
        </div>

        <button id="btn-login" onclick="startLogin()"
            class="w-full py-4 bg-white text-black rounded-2xl font-bold text-lg hover:bg-blue-50 transition-all active:scale-95 flex items-center justify-center gap-3">
            <span id="label-login">Xác thực ngay</span>
            <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>

        <div id="error-msg" class="mt-4 text-red-500 text-xs hidden animate-bounce"></div>

        <div id="reg-bridge" class="mt-6 hidden">
            <p class="text-slate-400 text-[10px] mb-2 uppercase tracking-tighter">Bạn là chủ sở hữu?</p>
            <a id="link-register" href="/register_security"
                class="text-blue-400 text-sm font-bold border-b border-blue-400/30 hover:text-blue-300 transition-colors">
                Đăng ký thiết bị này <i class="fa-solid fa-plus-circle ml-1"></i>
            </a>
        </div>

        <div class="mt-12 pt-8 border-t border-white/5">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-black">Powered by WebAuthn & Passkeys
            </p>
        </div>
    </div>

    <script>
        // Helper to convert base64url to Uint8Array
        function bufferDecode(value) {
            return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
        }

        // Helper to convert ArrayBuffer to base64url
        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function startLogin() {
            const btn = document.getElementById('btn-login');
            const label = document.getElementById('label-login');
            const errorDiv = document.getElementById('error-msg');

            errorDiv.classList.add('hidden');
            label.innerText = "Đang kiểm tra...";
            btn.disabled = true;

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

            // Show registration bridge if token exists OR on localhost
            if (token || isLocal) {
                const regBridge = document.getElementById('reg-bridge');
                const regLink = document.getElementById('link-register');
                regBridge.classList.remove('hidden');
                if (token) regLink.href = `/register_security?token=${token}`;
                else regLink.href = `/register_security`;
            }

            try {
                // 1. Get options from server
                const resp = await fetch('/api/auth/login/options' + (token ? `?token=${token}` : ''));
                const options = await resp.json();

                if (options.status === 'err') throw new Error(options.msg);

                // 2. Decode buffers
                options.challenge = bufferDecode(options.challenge);
                options.allowCredentials.forEach(cred => {
                    cred.id = bufferDecode(cred.id);
                });

                // 3. Trigger Biometric prompt
                const credential = await navigator.credentials.get({ publicKey: options });

                // 4. Encode response
                const credentialJson = {
                    id: credential.id,
                    rawId: bufferEncode(credential.rawId),
                    type: credential.type,
                    response: {
                        authenticatorData: bufferEncode(credential.response.authenticatorData),
                        clientDataJSON: bufferEncode(credential.response.clientDataJSON),
                        signature: bufferEncode(credential.response.signature),
                        userHandle: credential.response.userHandle ? bufferEncode(credential.response.userHandle) : null,
                    }
                };

                // 5. Verify with server
                const verifyResp = await fetch('/api/auth/login/verify' + (token ? `?token=${token}` : ''), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentialJson)
                });

                const result = await verifyResp.json();
                if (result.status === 'ok') {
                    window.location.href = '/';
                } else {
                    throw new Error(result.msg || "Xác thực thất bại");
                }
            } catch (err) {
                console.error(err);
                label.innerText = "Thử lại";
                btn.disabled = false;
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
