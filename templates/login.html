<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo mật - Cinema Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #050505; color: #fff; }
        .glass { background: rgba(255,255,255,.035); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.06); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">
    <div class="fixed inset-0 z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="glass w-full max-w-sm rounded-[36px] p-8 relative z-10 text-center shadow-2xl">
        <div class="mb-7">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-blue-600/30 mb-4">
                <i class="fa-solid fa-fingerprint text-white text-4xl"></i>
            </div>
            <h1 id="login-title" class="text-2xl font-bold mb-2">Mở khóa Cinema</h1>
            <p id="login-subtitle" class="text-slate-400 text-sm">Dùng Face ID, vân tay, Windows Hello hoặc PIN thiết bị.</p>
        </div>

        <button id="btn-login" onclick="startLogin()"
            class="w-full py-4 bg-white text-black rounded-2xl font-bold text-lg hover:bg-blue-50 transition active:scale-95 flex items-center justify-center gap-3 disabled:opacity-60">
            <span id="label-login">Xác thực bằng Passkey</span>
            <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>

        <label class="mt-4 flex items-center justify-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
            <input id="remember-session" type="checkbox" checked class="accent-blue-500">
            Giữ phiên đăng nhập 7 ngày
        </label>
        <p class="mt-1 text-[10px] text-slate-600">Cinema vẫn tự khóa sau 15 phút không hoạt động.</p>

        <div id="error-msg" class="mt-4 text-red-400 text-xs hidden"></div>

        <div id="reg-bridge" class="mt-6 hidden">
            <p class="text-slate-500 text-[10px] mb-2 uppercase tracking-widest">Thiết bị chưa có Passkey?</p>
            <a id="link-register" href="/register_security"
                class="text-blue-400 text-sm font-bold border-b border-blue-400/30 hover:text-blue-300 transition-colors">
                Đăng ký thiết bị này
            </a>
        </div>

        <div class="mt-10 pt-6 border-t border-white/5 flex items-center justify-center gap-2 text-[10px] text-slate-500 uppercase tracking-widest font-black">
            <i class="fa-solid fa-shield-halved"></i> WebAuthn · Passkey
        </div>
    </div>

    <script>
        function bufferDecode(value) {
            const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
            const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
            return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
        }

        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        function getBootstrapToken() {
            const hash = new URLSearchParams(window.location.hash.slice(1));
            const token = hash.get("t") || new URLSearchParams(window.location.search).get("token");
            if (window.location.hash) history.replaceState(null, "", window.location.pathname + window.location.search);
            return token;
        }

        function safeNext() {
            const value = new URLSearchParams(window.location.search).get("next") || "/";
            return value.startsWith("/") && !value.startsWith("//") ? value : "/";
        }

        const bootstrapToken = getBootstrapToken();
        const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);
        const isLocked = new URLSearchParams(window.location.search).get("locked") === "1";

        if (isLocked) {
            document.getElementById("login-title").textContent = "Cinema đã khóa";
            document.getElementById("login-subtitle").textContent = "Xác thực Passkey để tiếp tục phiên hiện tại.";
        }

        if (bootstrapToken || isLocal) {
            const bridge = document.getElementById("reg-bridge");
            const link = document.getElementById("link-register");
            bridge.classList.remove("hidden");
            link.href = bootstrapToken ? `/register_security#t=${encodeURIComponent(bootstrapToken)}` : "/register_security";
        }

        async function startLogin() {
            const btn = document.getElementById("btn-login");
            const label = document.getElementById("label-login");
            const errorDiv = document.getElementById("error-msg");

            errorDiv.classList.add("hidden");
            label.textContent = "Đang xác thực...";
            btn.disabled = true;

            try {
                if (!window.PublicKeyCredential || !navigator.credentials) {
                    throw new Error("Trình duyệt này không hỗ trợ Passkey/WebAuthn.");
                }

                const headers = bootstrapToken ? { "X-Cinema-Bootstrap": bootstrapToken } : {};
                const resp = await fetch("/api/auth/login/options", { headers });
                const payload = await resp.json();
                if (!resp.ok || payload.status === "err") throw new Error(payload.msg || "Không thể tạo yêu cầu xác thực");

                const options = payload.publicKey;
                options.challenge = bufferDecode(options.challenge);
                (options.allowCredentials || []).forEach(cred => { cred.id = bufferDecode(cred.id); });

                const credential = await navigator.credentials.get({ publicKey: options });
                const credentialJson = {
                    id: credential.id,
                    rawId: bufferEncode(credential.rawId),
                    type: credential.type,
                    response: {
                        authenticatorData: bufferEncode(credential.response.authenticatorData),
                        clientDataJSON: bufferEncode(credential.response.clientDataJSON),
                        signature: bufferEncode(credential.response.signature),
                        userHandle: credential.response.userHandle ? bufferEncode(credential.response.userHandle) : null,
                    }
                };

                const verifyResp = await fetch("/api/auth/login/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...headers },
                    body: JSON.stringify({
                        credential: credentialJson,
                        challenge_id: payload.challenge_id,
                        remember: document.getElementById("remember-session").checked,
                    })
                });
                const result = await verifyResp.json();
                if (!verifyResp.ok || result.status !== "ok") throw new Error(result.msg || "Xác thực thất bại");

                window.location.replace(safeNext());
            } catch (err) {
                label.textContent = "Thử lại";
                btn.disabled = false;
                errorDiv.textContent = err.message || "Xác thực thất bại";
                errorDiv.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
