<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo mật - Cinema Manager</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 16px; overflow: hidden; color: #fff; background: #050505;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        body::before, body::after {
            content: ""; position: fixed; width: 360px; height: 360px; border-radius: 999px;
            filter: blur(110px); opacity: .22; pointer-events: none;
        }
        body::before { background: #2563eb; top: 12%; left: 12%; }
        body::after { background: #7c3aed; bottom: 12%; right: 12%; }
        .card {
            width: min(100%, 390px); position: relative; z-index: 1; text-align: center;
            padding: 32px; border-radius: 32px; border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.04); backdrop-filter: blur(20px);
            box-shadow: 0 24px 70px rgba(0,0,0,.45);
        }
        .icon {
            width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 24px;
            display: grid; place-items: center; font-size: 36px;
            background: #2563eb; box-shadow: 0 18px 44px rgba(37,99,235,.28);
        }
        h1 { margin: 0 0 8px; font-size: 25px; }
        .sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .primary {
            width: 100%; border: 0; border-radius: 16px; padding: 15px 18px;
            font: inherit; font-weight: 750; font-size: 16px; cursor: pointer;
            color: #050505; background: #fff; transition: .15s ease;
        }
        .primary:hover { background: #dbeafe; }
        .primary:active { transform: scale(.985); }
        .primary:disabled { opacity: .55; cursor: wait; }
        .remember {
            margin-top: 16px; display: flex; gap: 8px; align-items: center;
            justify-content: center; color: #94a3b8; font-size: 12px; cursor: pointer;
        }
        .hint { margin: 6px 0 0; color: #475569; font-size: 10px; }
        .error { margin-top: 14px; color: #f87171; font-size: 12px; }
        .hidden { display: none !important; }
        .bridge {
            margin-top: 24px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.07);
        }
        .bridge p { margin: 0 0 8px; color: #64748b; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
        .bridge a { color: #60a5fa; font-size: 13px; font-weight: 700; text-decoration: none; }
        .footer {
            margin-top: 28px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.06);
            color: #475569; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">🔐</div>
        <h1 id="login-title">Mở khóa Cinema</h1>
        <p id="login-subtitle" class="sub">Dùng Face ID, vân tay, Windows Hello hoặc PIN thiết bị.</p>

        <button id="btn-login" class="primary" type="button" onclick="startLogin()">
            <span id="label-login">Xác thực bằng Passkey</span>
        </button>

        <label class="remember">
            <input id="remember-session" type="checkbox" checked>
            Giữ phiên đăng nhập 7 ngày
        </label>
        <p class="hint">Cinema vẫn tự khóa sau 15 phút không hoạt động.</p>

        <div id="error-msg" class="error hidden" role="alert"></div>

        <div id="reg-bridge" class="bridge hidden">
            <p>Thiết bị chưa có Passkey?</p>
            <a id="link-register" href="/register_security">Đăng ký thiết bị này</a>
        </div>

        <div class="footer">WebAuthn · Passkey</div>
    </main>

    <script>
        function bufferDecode(value) {
            const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
            const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
            return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
        }

        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        function getBootstrapToken() {
            const url = new URL(window.location.href);
            const hash = new URLSearchParams(url.hash.slice(1));
            const token = hash.get("t") || url.searchParams.get("token");
            url.hash = "";
            url.searchParams.delete("token");
            history.replaceState(null, "", url.pathname + url.search);
            return token;
        }

        function safeNext() {
            const value = new URLSearchParams(window.location.search).get("next") || "/";
            return value.startsWith("/") && !value.startsWith("//") ? value : "/";
        }

        const bootstrapToken = getBootstrapToken();
        const isLocal = ["localhost", "127.0.0.1"].includes(window.location.hostname);
        const isLocked = new URLSearchParams(window.location.search).get("locked") === "1";

        if (isLocked) {
            document.getElementById("login-title").textContent = "Cinema đã khóa";
            document.getElementById("login-subtitle").textContent =
                "Xác thực Passkey để tiếp tục phiên hiện tại.";
        }

        if (bootstrapToken || isLocal) {
            const bridge = document.getElementById("reg-bridge");
            const link = document.getElementById("link-register");
            bridge.classList.remove("hidden");
            link.href = bootstrapToken
                ? `/register_security#t=${encodeURIComponent(bootstrapToken)}`
                : "/register_security";
        }

        async function startLogin() {
            const btn = document.getElementById("btn-login");
            const label = document.getElementById("label-login");
            const errorDiv = document.getElementById("error-msg");

            errorDiv.classList.add("hidden");
            label.textContent = "Đang xác thực...";
            btn.disabled = true;

            try {
                if (!window.PublicKeyCredential || !navigator.credentials) {
                    throw new Error("Trình duyệt này không hỗ trợ Passkey/WebAuthn.");
                }

                const headers = bootstrapToken ? { "X-Cinema-Bootstrap": bootstrapToken } : {};
                const resp = await fetch("/api/auth/login/options", {
                    headers,
                    cache: "no-store",
                });
                const payload = await resp.json();
                if (!resp.ok || payload.status === "err") {
                    throw new Error(payload.msg || "Không thể tạo yêu cầu xác thực");
                }

                const options = payload.publicKey;
                options.challenge = bufferDecode(options.challenge);
                (options.allowCredentials || []).forEach(cred => {
                    cred.id = bufferDecode(cred.id);
                });

                const credential = await navigator.credentials.get({ publicKey: options });
                const credentialJson = {
                    id: credential.id,
                    rawId: bufferEncode(credential.rawId),
                    type: credential.type,
                    response: {
                        authenticatorData: bufferEncode(credential.response.authenticatorData),
                        clientDataJSON: bufferEncode(credential.response.clientDataJSON),
                        signature: bufferEncode(credential.response.signature),
                        userHandle: credential.response.userHandle
                            ? bufferEncode(credential.response.userHandle)
                            : null,
                    }
                };

                const verifyResp = await fetch("/api/auth/login/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...headers },
                    body: JSON.stringify({
                        credential: credentialJson,
                        challenge_id: payload.challenge_id,
                        remember: document.getElementById("remember-session").checked,
                    })
                });
                const result = await verifyResp.json();
                if (!verifyResp.ok || result.status !== "ok") {
                    throw new Error(result.msg || "Xác thực thất bại");
                }

                window.location.replace(safeNext());
            } catch (err) {
                label.textContent = "Thử lại";
                btn.disabled = false;
                errorDiv.textContent = err.message || "Xác thực thất bại";
                errorDiv.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
