<div id="pin-overlay" class="fixed inset-0 z-[200] bg-slate-950 flex flex-col items-center justify-center p-6 hidden">
    <div class="w-full max-w-xs space-y-8 animate-in fade-in zoom-in duration-300">
        <div class="text-center space-y-2">
            <i class="fa-solid fa-lock text-blue-500 text-4xl mb-4"></i>
            <h2 class="text-2xl font-bold text-white uppercase tracking-widest">Nhập Mã PIN</h2>
            <p class="text-slate-400 text-xs">Vui lòng nhập mã bảo mật để truy cập thư viện</p>
        </div>
        <div class="flex justify-center gap-3" id="pin-dots">
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
            <div class="w-4 h-4 rounded-full border-2 border-slate-700"></div>
        </div>
        <div class="grid grid-cols-3 gap-4">
            <button onclick="pressPin(1)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">1</button>
            <button onclick="pressPin(2)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">2</button>
            <button onclick="pressPin(3)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">3</button>
            <button onclick="pressPin(4)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">4</button>
            <button onclick="pressPin(5)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">5</button>
            <button onclick="pressPin(6)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">6</button>
            <button onclick="pressPin(7)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">7</button>
            <button onclick="pressPin(8)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">8</button>
            <button onclick="pressPin(9)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">9</button>
            <div class="flex items-center justify-center">
                <button onclick="clearPin()"
                    class="text-slate-500 hover:text-white font-bold uppercase text-xs">Xóa</button>
            </div>
            <button onclick="pressPin(0)"
                class="h-16 rounded-2xl bg-slate-900 text-2xl font-bold text-white hover:bg-slate-800 transition active:scale-95">0</button>
            <div class="flex items-center justify-center">
                <button onclick="verifyPin()"
                    class="text-blue-500 hover:text-blue-400 font-bold uppercase text-xs">OK</button>
            </div>
        </div>
        <p id="pin-error" class="text-red-500 text-[10px] text-center font-bold opacity-0 transition-opacity">MÃ PIN
            KHÔNG CHÍNH XÁC</p>
    </div>
</div>
