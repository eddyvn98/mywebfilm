<div id="video-modal"
    class="fixed inset-0 z-[100] translate-y-full transition-transform duration-300 ease-in-out bg-black flex flex-col hidden">
    <div id="drag-handle"
        class="h-12 w-full flex items-center justify-center bg-gradient-to-b from-black/80 to-black/0 absolute top-0 z-50 cursor-grab active:cursor-grabbing touch-none">
        <div class="w-16 h-1.5 bg-white/30 rounded-full"></div>
    </div>
    <div class="player-topbar absolute top-4 left-6 z-50 flex items-center gap-4 max-w-[calc(100%-100px)]">
        <button id="player-btn-favorite" onclick="togglePlayerFavorite()"
            class="shrink-0 w-8 h-8 flex items-center justify-center hover:scale-110 active:scale-90 transition pointer-events-auto">
            <i class="fa-regular fa-heart text-white/70 text-xl"></i>
        </button>
        <h2 id="video-modal-title"
            class="text-white font-bold text-sm md:text-base drop-shadow-md truncate opacity-70 pointer-events-none">
        </h2>
    </div>
    <button onclick="closeVideoModal()"
        class="player-close absolute top-4 right-4 z-50 w-10 h-10 bg-black/50 backdrop-blur rounded-full flex items-center justify-center text-white/80 hover:bg-white/20 transition">
        <i class="fa-solid fa-xmark text-xl"></i>
    </button>
    <div class="player-stage flex-1 relative bg-black flex items-center justify-center overflow-hidden">
        <video id="modal-player" playsinline controls class="player-media max-w-full max-h-full"></video>
    </div>
</div>
