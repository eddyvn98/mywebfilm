<div id="security-modal" class="fixed inset-0 z-[210] hidden">
    <div class="absolute inset-0 bg-black/85 backdrop-blur-md" onclick="closeSecurityModal()"></div>
    <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 mx-auto max-w-lg max-h-[88vh] overflow-y-auto rounded-3xl border border-white/10 bg-slate-950 shadow-2xl">
        <div class="sticky top-0 z-10 flex items-center justify-between border-b border-white/10 bg-slate-950/95 px-5 py-4 backdrop-blur">
            <div>
                <h3 class="font-bold text-white">Bảo mật Cinema</h3>
                <p class="text-[10px] text-slate-500">Passkey · tự khóa sau 15 phút</p>
            </div>
            <button onclick="closeSecurityModal()" class="w-9 h-9 rounded-full bg-white/5 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-5 space-y-5">
            <div class="grid grid-cols-2 gap-2">
                <button onclick="lockCinema()" class="h-11 rounded-xl bg-blue-600/15 border border-blue-500/20 text-blue-300 text-xs font-bold hover:bg-blue-600/25">
                    <i class="fa-solid fa-lock mr-2"></i>Khóa ngay
                </button>
                <button onclick="logoutCinema()" class="h-11 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 text-xs font-bold hover:bg-red-500/20">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i>Đăng xuất
                </button>
            </div>

            <section>
                <div class="flex items-center justify-between mb-2">
                    <div>
                        <h4 class="text-xs font-bold text-white uppercase tracking-wider">Thiết bị tin cậy</h4>
                        <p class="text-[10px] text-slate-500">Mỗi thiết bị dùng một Passkey riêng hoặc Passkey đã đồng bộ.</p>
                    </div>
                    <button onclick="createDeviceInvite()" class="px-3 h-8 rounded-lg bg-emerald-500/10 text-emerald-300 text-[10px] font-bold hover:bg-emerald-500/20">
                        <i class="fa-solid fa-plus mr-1"></i>Thêm thiết bị
                    </button>
                </div>
                <div id="trusted-device-list" class="space-y-2"></div>
            </section>

            <section id="device-invite-panel" class="hidden rounded-2xl border border-emerald-500/20 bg-emerald-500/5 p-4">
                <div class="flex flex-col sm:flex-row items-center gap-4">
                    <div id="device-invite-qr" class="bg-white p-2 rounded-xl shrink-0"></div>
                    <div class="w-full min-w-0">
                        <div class="text-xs font-bold text-emerald-300 mb-1">Đăng ký thiết bị mới</div>
                        <div id="device-invite-ttl" class="text-[10px] text-slate-500 mb-2"></div>
                        <input id="device-invite-url" readonly class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2 text-[10px] text-slate-400 truncate">
                        <button onclick="copyDeviceInvite()" class="mt-2 w-full h-9 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-white">
                            <i class="fa-solid fa-copy mr-1"></i>Copy link
                        </button>
                    </div>
                </div>
            </section>

            <div class="rounded-xl border border-white/5 bg-white/[0.02] p-3 text-[10px] leading-5 text-slate-500">
                Thiết bị mất hoặc không còn dùng nên được thu hồi tại đây. Thiết bị hiện tại không thể tự thu hồi để tránh tự khóa tài khoản.
            </div>
        </div>
    </div>
</div>
