<div id="rename-modal"
    class="fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-center justify-center p-6 hidden">
    <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 w-full max-w-sm space-y-4">
        <h3 class="text-white font-bold text-sm uppercase tracking-widest">Đổi tên file</h3>
        <input type="text" id="rename-input"
            class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm outline-none focus:border-blue-500 transition">
        <div class="flex gap-2 pt-2">
            <button onclick="closeRenameModal()"
                class="flex-1 h-11 rounded-xl bg-slate-800 text-white text-xs font-bold uppercase">Hủy</button>
            <button onclick="confirmRename()"
                class="flex-1 h-11 rounded-xl bg-blue-600 text-white text-xs font-bold uppercase">Lưu</button>
        </div>
    </div>
</div>
