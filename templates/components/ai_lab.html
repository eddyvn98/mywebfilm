<div id="ai-lab-overlay"
    class="fixed inset-0 z-[120] bg-slate-950/98 backdrop-blur-3xl translate-y-full transition-transform duration-500 ease-out flex flex-col hidden">
    <header class="h-16 flex items-center justify-between px-6 border-b border-white/5 bg-slate-900/50 shadow-2xl">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <i class="fa-solid fa-wand-magic-sparkles text-white text-xs"></i>
            </div>
            <div>
                <h2 class="text-white font-black text-xs tracking-[0.2em] uppercase">AI Management Studio</h2>
                <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Normalizing & Injecting
                    Metadata</p>
            </div>
        </div>
        <button onclick="closeAiLab()"
            class="group w-10 h-10 rounded-full bg-white/5 flex items-center justify-center hover:bg-red-500 transition-all duration-300">
            <i class="fa-solid fa-xmark text-white/50 group-hover:text-white group-hover:rotate-90 transition-all"></i>
        </button>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Left Sidebar: Unverified Files -->
        <aside class="w-80 border-r border-white/5 flex flex-col bg-slate-900/30">
            <div class="p-4 space-y-3">
                <div class="relative">
                    <i
                        class="fa-solid fa-filter absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-[10px]"></i>
                    <input type="text" id="mgmt-search" placeholder="Lọc danh sách..."
                        class="w-full bg-white/5 border border-white/10 rounded-xl py-2 pl-8 pr-3 text-[10px] text-white outline-none focus:border-blue-500/50 transition">
                </div>
                <div class="flex justify-between items-center px-1">
                    <span class="text-[8px] font-black text-slate-500 uppercase tracking-widest" id="mgmt-count">0 File
                        Chờ</span>
                    <button onclick="loadUnverifiedList()"
                        class="text-[8px] text-blue-500 font-black hover:underline uppercase">Làm mới</button>
                </div>
            </div>
            <div id="mgmt-file-list" class="flex-1 overflow-y-auto px-2 space-y-1">
                <!-- JS Dynamic list -->
            </div>
        </aside>

        <!-- Center: Metadata Editor -->
        <main class="flex-1 overflow-y-auto p-8 bg-black/20">
            <div id="mgmt-editor-empty" class="h-full flex flex-col items-center justify-center space-y-4 opacity-50">
                <i class="fa-solid fa-hand-pointer text-4xl text-slate-700"></i>
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Chọn một file để bắt
                    đầu chuẩn hóa</p>
            </div>

            <div id="mgmt-editor-content" class="max-w-3xl mx-auto space-y-8 hidden">
                <!-- AI Assistant Banner -->
                <div
                    class="bg-gradient-to-r from-purple-500/10 to-blue-500/10 border border-purple-500/20 rounded-2xl p-6 flex items-center justify-between shadow-xl">
                    <div class="flex items-center gap-4">
                        <div
                            class="w-12 h-12 rounded-2xl bg-purple-600 flex items-center justify-center shadow-lg shadow-purple-600/30 animate-pulse">
                            <i class="fa-solid fa-robot text-white text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-white font-black text-xs uppercase tracking-wider">AI Assistant</h3>
                            <p class="text-[9px] text-slate-400">Tự động phân tích tên file và đề xuất metadata.</p>
                        </div>
                    </div>
                    <button onclick="runAiAnalyzeMgmt()" id="btn-run-ai-mgmt"
                        class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition active:scale-95 shadow-lg shadow-purple-600/20">
                        CHẠY PHÂN TÍCH
                    </button>
                </div>

                <!-- Manual JSON Import -->
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1">Nhập
                            JSON</label>
                        <button onclick="parseJsonMetadata()"
                            class="text-[9px] text-blue-500 font-bold hover:underline">Tự điền</button>
                    </div>
                    <textarea id="mgmt-json-input" rows="2"
                        placeholder='VD: { "code": "ABC-123", "title": "Phim hay..." }'
                        class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2 text-xs text-slate-300 outline-none focus:border-blue-500 transition font-mono"></textarea>
                </div>

                <!-- Editor Form -->
                <div class="grid grid-cols-2 gap-6">
                    <div class="space-y-2 col-span-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1">Tiêu đề
                            phim</label>
                        <input type="text" id="mgmt-title"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1">Mã
                            phim</label>
                        <input type="text" id="mgmt-code"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1">Hãng
                            phim</label>
                        <input type="text" id="mgmt-studio"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2 col-span-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1">Diễn
                            viên</label>
                        <input type="text" id="mgmt-actors"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2 col-span-2">
                        <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest ml-1">Thể
                            loại</label>
                        <input type="text" id="mgmt-genres"
                            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="flex items-center gap-6 pt-4 border-t border-white/5">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <div
                            class="relative w-10 h-6 bg-slate-800 rounded-full transition-colors group-hover:bg-slate-700">
                            <input type="checkbox" id="mgmt-rename" checked class="sr-only peer">
                            <div
                                class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4 peer-checked:bg-blue-500">
                            </div>
                        </div>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest transition">Tự động
                            đổi tên file</span>
                    </label>
                    <div class="flex-1"></div>
                    <button onclick="finalizeMetadata()" id="btn-finalize"
                        class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-2xl text-xs font-black uppercase tracking-[0.2em] transition active:scale-95 shadow-xl shadow-blue-600/30 flex items-center gap-3">
                        <i class="fa-solid fa-check-double scale-125"></i>
                        HOÀN TẤT & LƯU
                    </button>
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Assets -->
        <aside class="w-80 border-l border-white/5 bg-slate-900/40 p-6 space-y-8 overflow-y-auto hidden md:block">
            <div class="space-y-4">
                <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest flex justify-between">Studio
                    Assets <i class="fa-solid fa-building"></i></h3>
                <div id="mgmt-studio-list" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="space-y-4">
                <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest flex justify-between">Idols
                    Gallery <i class="fa-solid fa-id-badge"></i></h3>
                <div id="mgmt-actor-gallery" class="grid grid-cols-2 gap-3"></div>
                <div class="space-y-2 pt-4 border-t border-white/5">
                    <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Quick Actors</h3>
                    <div id="mgmt-all-actors-list" class="grid grid-cols-2 gap-1 max-h-[200px] overflow-y-auto pr-2">
                    </div>
                </div>
            </div>
            <div class="space-y-4">
                <h3 class="text-[9px] font-black text-slate-500 uppercase tracking-widest flex justify-between">Smart
                    Genres <i class="fa-solid fa-tags"></i></h3>
                <div id="mgmt-genre-chips" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="space-y-4 pt-6 mt-6 border-t border-white/5">
                <h3 class="text-[9px] font-black text-blue-500 uppercase tracking-widest flex justify-between">Browser
                    Cookies <i class="fa-solid fa-cookie-bite"></i></h3>
                <textarea id="mgmt-cookies" rows="4" placeholder="Cookie string..."
                    class="w-full bg-slate-950 border border-white/5 rounded-xl px-3 py-2 text-[9px] text-slate-400 outline-none font-mono"></textarea>
                <button onclick="saveScrapperCookies()"
                    class="w-full bg-slate-800 hover:bg-blue-600 text-white py-2 rounded-xl text-[8px] font-black uppercase">Lưu
                    Cookie</button>
            </div>
        </aside>
    </div>
</div>
