<div id="movie-info-modal"
    class="fixed inset-0 z-[190] hidden bg-black/80 backdrop-blur-md p-3 sm:p-6 flex items-center justify-center"
    onclick="if (event.target === this) closeMovieInfo()">
    <section class="movie-info-panel w-full max-w-2xl max-h-[92vh] overflow-y-auto no-scrollbar rounded-2xl border border-white/10 bg-slate-950 shadow-2xl shadow-black/60">
        <header class="sticky top-0 z-10 flex items-start justify-between gap-4 px-5 py-4 border-b border-white/10 bg-slate-950/95 backdrop-blur-xl">
            <div class="min-w-0">
                <p class="text-[9px] font-black tracking-[0.18em] text-blue-400 uppercase">Thông tin phim</p>
                <h2 id="movie-info-title" class="mt-1 text-base sm:text-lg font-extrabold text-white leading-snug break-words">—</h2>
            </div>
            <button onclick="closeMovieInfo()" class="shrink-0 w-9 h-9 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition flex items-center justify-center" aria-label="Đóng">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>

        <div class="p-5 space-y-5">
            <section>
                <div class="flex items-center justify-between gap-3 mb-2">
                    <h3 class="text-[9px] font-black tracking-[0.16em] text-slate-500 uppercase">Vị trí trên máy</h3>
                    <span class="text-[9px] text-slate-600">Đường dẫn thật của file</span>
                </div>
                <div class="rounded-xl border border-white/10 bg-black/35 p-3">
                    <p id="movie-info-path" class="font-mono text-[11px] leading-relaxed text-slate-300 break-all select-text">—</p>
                </div>
                <div class="mt-3 grid grid-cols-2 gap-2">
                    <button id="movie-info-copy-btn" onclick="copyMoviePath()" class="h-10 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 text-slate-200 text-xs font-bold transition flex items-center justify-center gap-2">
                        <i class="fa-regular fa-copy"></i><span>Copy đường dẫn</span>
                    </button>
                    <button id="movie-info-explorer-btn" onclick="openMovieInExplorer()" class="h-10 rounded-lg border border-blue-500/25 bg-blue-500/10 hover:bg-blue-600 text-blue-300 hover:text-white text-xs font-bold transition flex items-center justify-center gap-2">
                        <i class="fa-regular fa-folder-open"></i><span>Mở trong Explorer</span>
                    </button>
                </div>
                <p class="mt-2 text-[9px] leading-relaxed text-slate-600">Mở trong Explorer hoạt động khi truy cập trực tiếp localhost trên máy Windows đang chứa thư viện.</p>
            </section>

            <section class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <div class="rounded-xl border border-white/10 bg-white/[0.025] p-3"><p class="text-[8px] font-black text-slate-600 uppercase tracking-wider">Thư mục</p><p id="movie-info-folder" class="mt-1 text-xs font-bold text-slate-200 break-words">—</p></div>
                <div class="rounded-xl border border-white/10 bg-white/[0.025] p-3"><p class="text-[8px] font-black text-slate-600 uppercase tracking-wider">Loại</p><p id="movie-info-type" class="mt-1 text-xs font-bold text-slate-200">—</p></div>
                <div class="rounded-xl border border-white/10 bg-white/[0.025] p-3"><p class="text-[8px] font-black text-slate-600 uppercase tracking-wider">Định dạng</p><p id="movie-info-ext" class="mt-1 text-xs font-bold text-slate-200">—</p></div>
                <div class="rounded-xl border border-white/10 bg-white/[0.025] p-3"><p class="text-[8px] font-black text-slate-600 uppercase tracking-wider">Dung lượng</p><p id="movie-info-size" class="mt-1 text-xs font-bold text-slate-200">—</p></div>
                <div class="rounded-xl border border-white/10 bg-white/[0.025] p-3"><p class="text-[8px] font-black text-slate-600 uppercase tracking-wider">Thời lượng</p><p id="movie-info-duration" class="mt-1 text-xs font-bold text-slate-200">—</p></div>
                <div class="rounded-xl border border-white/10 bg-white/[0.025] p-3"><p class="text-[8px] font-black text-slate-600 uppercase tracking-wider">Lượt xem</p><p id="movie-info-views" class="mt-1 text-xs font-bold text-slate-200">—</p></div>
            </section>

            <section>
                <div class="flex items-center justify-between gap-3 mb-2">
                    <h3 class="text-[9px] font-black tracking-[0.16em] text-slate-500 uppercase">Metadata</h3>
                    <span id="movie-info-added" class="text-[9px] text-slate-600">—</span>
                </div>
                <div id="movie-info-categories" class="flex flex-wrap gap-1.5"></div>
            </section>
        </div>
    </section>
</div>
