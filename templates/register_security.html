<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Thiết bị - Cinema Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #050505;
            color: #fff;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-blur: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass w-full max-w-sm rounded-[40px] p-8 text-center shadow-2xl">
        <div class="mb-8">
            <div
                class="w-20 h-20 bg-green-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-green-600/40 mb-4">
                <i class="fa-solid fa-key text-white text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Đăng ký Passkey</h1>
            <p class="text-slate-400 text-sm">Thêm thiết bị này vào danh sách tin cậy</p>
        </div>

        <button id="btn-register" onclick="startRegister()"
            class="w-full py-4 bg-white text-black rounded-2xl font-bold text-lg hover:bg-green-50 transition-all active:scale-95 flex items-center justify-center gap-3">
            <span id="label-reg">Bắt đầu đăng ký</span>
            <i class="fa-solid fa-plus text-sm"></i>
        </button>

        <div id="error-msg" class="mt-4 text-red-500 text-xs hidden"></div>
        <div id="success-msg" class="mt-4 text-green-500 text-xs hidden">Đăng ký thành công! Đang chuyển hướng...</div>
    </div>

    <script>
        function bufferDecode(value) {
            return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
        }

        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        async function startRegister() {
            const btn = document.getElementById('btn-register');
            const label = document.getElementById('label-reg');
            const errorDiv = document.getElementById('error-msg');
            const successDiv = document.getElementById('success-msg');

            errorDiv.classList.add('hidden');
            label.innerText = "Đang xử lý...";
            btn.disabled = true;

            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            try {
                // 1. Get options
                const resp = await fetch('/api/auth/register/options' + (token ? `?token=${token}` : ''));
                const options = await resp.json();

                if (options.status === 'err') throw new Error(options.msg);

                // 2. Decode
                options.challenge = bufferDecode(options.challenge);
                options.user.id = bufferDecode(options.user.id);

                // 3. Create Credential
                const credential = await navigator.credentials.create({ publicKey: options });

                // 4. Encode
                const credentialJson = {
                    id: credential.id,
                    rawId: bufferEncode(credential.rawId),
                    type: credential.type,
                    response: {
                        attestationObject: bufferEncode(credential.response.attestationObject),
                        clientDataJSON: bufferEncode(credential.response.clientDataJSON),
                    }
                };

                // 5. Verify con server
                const verifyResp = await fetch('/api/auth/register/verify' + (token ? `?token=${token}` : ''), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentialJson)
                });

                const result = await verifyResp.json();
                if (result.status === 'ok') {
                    successDiv.classList.remove('hidden');
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    throw new Error(result.msg || "Đăng ký thất bại");
                }
            } catch (err) {
                console.error(err);
                label.innerText = "Thử lại";
                btn.disabled = false;
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
            }
        }
    </script>
</body>

</html>
