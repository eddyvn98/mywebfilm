<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thiết bị - Cinema Manager</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 16px; color: #fff; background: #050505;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            width: min(100%, 390px); padding: 32px; text-align: center;
            border-radius: 32px; border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.04); box-shadow: 0 24px 70px rgba(0,0,0,.45);
        }
        .icon {
            width: 78px; height: 78px; margin: 0 auto 18px; border-radius: 24px;
            display: grid; place-items: center; font-size: 34px;
            background: #059669; box-shadow: 0 18px 44px rgba(5,150,105,.25);
        }
        h1 { margin: 0 0 8px; font-size: 25px; }
        .sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .field { text-align: left; margin-bottom: 16px; }
        .field label {
            display: block; margin-bottom: 7px; color: #64748b; font-size: 10px;
            font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
        }
        .field input {
            width: 100%; padding: 12px 14px; color: #fff; background: rgba(0,0,0,.28);
            border: 1px solid rgba(255,255,255,.1); border-radius: 12px; outline: none;
        }
        .field input:focus { border-color: rgba(16,185,129,.65); }
        .primary {
            width: 100%; border: 0; border-radius: 16px; padding: 15px 18px;
            font: inherit; font-weight: 750; font-size: 16px; cursor: pointer;
            color: #050505; background: #fff; transition: .15s ease;
        }
        .primary:hover { background: #d1fae5; }
        .primary:disabled { opacity: .55; cursor: wait; }
        .error, .success { margin-top: 14px; font-size: 12px; }
        .error { color: #f87171; }
        .success { color: #34d399; }
        .hidden { display: none !important; }
        .hint { margin: 26px 0 0; color: #475569; font-size: 10px; line-height: 1.5; }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">🔑</div>
        <h1>Thêm thiết bị tin cậy</h1>
        <p class="sub">Passkey của thiết bị này sẽ được phép mở Cinema.</p>

        <div class="field">
            <label for="device-name">Tên thiết bị</label>
            <input id="device-name" maxlength="80" autocomplete="off" placeholder="VD: MacBook cá nhân">
        </div>

        <button id="btn-register" class="primary" type="button" onclick="startRegister()">
            <span id="label-reg">Tạo Passkey</span>
        </button>

        <div id="error-msg" class="error hidden" role="alert"></div>
        <div id="success-msg" class="success hidden">Đã đăng ký và mở khóa thiết bị.</div>
        <p class="hint">Link đăng ký từ xa chỉ dùng một lần và tự hết hạn.</p>
    </main>

    <script>
        function bufferDecode(value) {
            const normalized = value.replace(/-/g, "+").replace(/_/g, "/");
            const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
            return Uint8Array.from(atob(padded), c => c.charCodeAt(0));
        }

        function bufferEncode(value) {
            return btoa(String.fromCharCode.apply(null, new Uint8Array(value)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }

        function getBootstrapToken() {
            const url = new URL(window.location.href);
            const hash = new URLSearchParams(url.hash.slice(1));
            const token = hash.get("t") || url.searchParams.get("token");
            url.hash = "";
            url.searchParams.delete("token");
            history.replaceState(null, "", url.pathname + url.search);
            return token;
        }

        const bootstrapToken = getBootstrapToken();
        const platform = navigator.userAgentData?.platform || navigator.platform || "Thiết bị mới";
        document.getElementById("device-name").value = platform;

        async function startRegister() {
            const btn = document.getElementById("btn-register");
            const label = document.getElementById("label-reg");
            const errorDiv = document.getElementById("error-msg");
            const successDiv = document.getElementById("success-msg");

            errorDiv.classList.add("hidden");
            successDiv.classList.add("hidden");
            label.textContent = "Đang tạo Passkey...";
            btn.disabled = true;

            try {
                if (!window.PublicKeyCredential || !navigator.credentials) {
                    throw new Error("Trình duyệt này không hỗ trợ Passkey/WebAuthn.");
                }

                const headers = bootstrapToken ? { "X-Cinema-Bootstrap": bootstrapToken } : {};
                const resp = await fetch("/api/auth/register/options", {
                    headers,
                    cache: "no-store",
                });
                const payload = await resp.json();
                if (!resp.ok || payload.status === "err") {
                    throw new Error(payload.msg || "Không thể đăng ký thiết bị");
                }

                const options = payload.publicKey;
                options.challenge = bufferDecode(options.challenge);
                options.user.id = bufferDecode(options.user.id);
                (options.excludeCredentials || []).forEach(cred => {
                    cred.id = bufferDecode(cred.id);
                });

                const credential = await navigator.credentials.create({ publicKey: options });
                const credentialJson = {
                    id: credential.id,
                    rawId: bufferEncode(credential.rawId),
                    type: credential.type,
                    response: {
                        attestationObject: bufferEncode(credential.response.attestationObject),
                        clientDataJSON: bufferEncode(credential.response.clientDataJSON),
                    }
                };

                const verifyResp = await fetch("/api/auth/register/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", ...headers },
                    body: JSON.stringify({
                        credential: credentialJson,
                        challenge_id: payload.challenge_id,
                        device_name: document.getElementById("device-name").value,
                    })
                });
                const result = await verifyResp.json();
                if (!verifyResp.ok || result.status !== "ok") {
                    throw new Error(result.msg || "Đăng ký thất bại");
                }

                successDiv.classList.remove("hidden");
                setTimeout(() => window.location.replace("/"), 500);
            } catch (err) {
                label.textContent = "Thử lại";
                btn.disabled = false;
                errorDiv.textContent = err.message || "Đăng ký thất bại";
                errorDiv.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
