name: CI

on:
  push:
    branches: [main, production-hardening-2026-09-30]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        env:
          CINEMA_DATA_DIR: ${{ runner.temp }}/cinema-data
          CINEMA_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-tests
        run: pytest -q --cov=. --cov-report=term-missing --cov-fail-under=25
      - name: Check JavaScript syntax
        run: |
          for file in static/js/*.js; do
            node --check "$file"
          done
