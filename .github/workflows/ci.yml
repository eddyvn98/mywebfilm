name: CI

on:
  push:
    branches: [main, production-hardening-2026-09-30]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Import runtime dependencies
        run: python -c "import ddgs, waitress"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        env:
          CINEMA_DATA_DIR: ${{ runner.temp }}/cinema-data
          CINEMA_SECRET_KEY: ci-only-test-secret-32-bytes-minimum-2026
        run: python -m pytest -q --cov=config_manager --cov=storage_utils --cov=runtime_db --cov=media_catalog --cov=media_job_store --cov=operation_journal --cov=fs_catalog --cov=backup_service --cov=ffmpeg_conversion --cov=sort_engine --cov=ffmpeg_service --cov=routes --cov=security_service --cov-report=term-missing --cov-fail-under=25
      - name: Check JavaScript syntax
        run: |
          for file in static/js/*.js; do
            node --check "$file"
          done
      - name: Smoke test FSR WebGL2 shaders in headless Chrome
        run: |
          python -m pip install playwright==1.56.0
          python tests/browser_upscale_smoke.py


  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run Windows E2E and recovery tests
        env:
          CINEMA_DATA_DIR: ${{ runner.temp }}\cinema-data
          CINEMA_SECRET_KEY: ci-only-test-secret-32-bytes-minimum-2026
        run: python -m pytest -q test_windows_e2e.py test_backup_restore.py test_failure_injection.py test_media_safety.py test_library_integration.py test_security.py test_security_hardening.py test_ai_inject_rename_security.py
